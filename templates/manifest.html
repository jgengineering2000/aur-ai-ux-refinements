    // specifically crossed a line of its own.
    const loadLvl = lvl(lt(s.id, s.min_idle_pct), lt(s.id, s.q_min_idle_pct));

    // Swap: latch on any upward move, clear only once the machine is quiet.
    const swapUsedMb = (s.sw_total_mb !== undefined && s.sw_avail_mb !== undefined)
      ? s.sw_total_mb - s.sw_avail_mb : null;
    if (swapUsedMb !== null) {
      if (lastSwapUsedMb !== null && swapUsedMb > lastSwapUsedMb) swapPressure = true;
      lastSwapUsedMb = swapUsedMb;
    }
    const loadPct = (s.us || 0) + (s.ni || 0) + (s.sy || 0);
    if (swapPressure && loadPct < SWAP_CLEAR_LOAD_PCT) swapPressure = false;

    el.innerHTML =
      // `us` — top's USER share. This column briefly showed idle under an `lo`
      // label, which inverted its sense: a reader who learned "high means busy"
      // was being shown a number where high means free. It is judged against
      // `min_idle_pct` rather than against itself because idle is what the
      // admission gates are actually specified on — so the column shows who
      // took the CPU, and goes amber exactly when the gate would refuse work.
        f(pc(s.us), 'us', loadLvl)
      + f(pc(s.ni), 'ni', loadLvl)
      // `sy` sits AFTER `ni`, beside `wa`: system time and iowait are the pair
      // that move together when the machine is in trouble, and reading them
      // apart is what let a rising kernel share pass unnoticed. Kernel time is
      // overhead, not work, so it is judged on its own bounds rather than
      // against a headroom figure that has nothing to say about it.
      + f(pc(s.sy), 'sy', lvl(gt(s.sy, SY_HEADROOM_PCT), gt(s.sy, SY_QUIET_PCT)))
      + f(pc(s.wa), 'wa', lvl(gt(s.wa, s.max_iowait_pct), gt(s.wa, s.q_max_iowait_pct)))
      // AVAILABLE against total, not used — the number a scheduler admits on,
      // and the one that answers "can this machine take more work".
      // All three capacities read AVAILABLE / TOTAL, in that order and that
      // sense. Available is the number that answers "can this machine take more
      // work"; total is there for scale, so a reader can judge 13G against 30G
      // rather than against nothing. Mixing in a `used` would make one of the
      // three read backwards from its neighbours.
      + f(`${g(mb(s.mem_avail_mb))}/${g(mb(s.mem_total_mb))}`, '',
          lvl(lt(s.mem_avail_mb, s.reserve_mb), lt(memFreePct, s.q_min_free_ram_pct)))
          .replace('<b>', '<i>mem</i> <b>')
      + f(`${g(mb(s.sw_avail_mb))}/${g(mb(s.sw_total_mb))}`, '',
          swapPressure ? 'warn' : false)
          .replace('<b>', '<i>swp</i> <b>')
      + f(`${g(mb(s.st_free_mb))}/${g(mb(s.st_total_mb))}`, '',
          lt(s.st_free_mb, s.disk_reserve_mb))
          .replace('<b>', '<i>stor</i> <b>')
      + (s.status === 'stale'
          ? `<span class="sf gap">stale ${s.age_s}s</span>` : '');
  }

  // The spool's own size, shown ALWAYS rather than only when breached.
  //
  // A limit that appears at the moment it is crossed teaches a reader nothing
  // about where they normally sit, so the first time they see it they cannot
  // tell "unusual" from "Tuesday". This exists to make a runaway command — an
  // ltrace, a debug build with tracing left on — obvious WHILE it is still
  // writing, which means the normal number has to have been visible all along.
  //
  // Nothing here caps anything. Capture continues past the threshold, because
  // silently dropping output is the exact defect the spool was built to fix.
  function renderSpool(sp) {
    const el = document.getElementById('spoolline');
    if (!el) return;
    if (!sp) { el.textContent = ''; return; }
    const bad = !!sp.over;
    const f = (v, l, flag) => `<span class="sf${flag ? ' bad' : ''}">`
      + `<i>${l}</i> <b>${v}</b></span>`;
    el.innerHTML =
        `<span class="sl">Spool</span>`
      + f(`${fmtBytes(sp.bytes)}/${fmtBytes(sp.alert_total)}`, 'total',
          sp.bytes > sp.alert_total)
      // One file per foreground command inside the retention window — so this
      // counts COMMANDS, not sessions, which is why it runs to the hundreds on
      // an ordinary week without meaning anything is wrong.
      + f(sp.files, 'cmds')
      // Ping-style, because a lone maximum cannot say whether it is an outlier:
      // 185K reads alarming beside nothing and unremarkable beside a 7K mean.
      + (sp.files
          ? f(`${fmtBytes(sp.min)}/${fmtBytes(sp.avg)}/${fmtBytes(sp.max)}`,
              'min/avg/max', sp.max > sp.alert_single)
          : '')
      + (bad ? `<span class="sf bad">over limit — capture continues</span>` : '');
  }

  // ── One-shot report table ─────────────────────────────────────────────────
  //
  // Retention is MANUAL, always. These are the record of something going wrong,
  // and a table that quietly deletes them is worse than no table — so nothing
  // here expires, and every removal is a selection the reader made.
  let crashRows = [], crashSel = new Set(), crashArmed = false;

  function crashAge(s) {
    if (s < 3600) return Math.round(s / 60) + 'm';
    if (s < 86400) return Math.round(s / 3600) + 'h';
    return Math.round(s / 86400) + 'd';
  }

  function renderCrashes() {
    const el = document.getElementById('crash-panel');
    if (!el) return;
    if (!crashRows.length) { el.innerHTML = '<div class="empty">No reports.</div>'; return; }
    const bytes = crashRows.reduce((a, r) => a + r.size, 0);
    const head = '<div class="crash-head"><span></span><span>process</span>'
      + '<span>pid</span><span class="crash-why">why</span><span>when</span>'
      + '<span>size</span><span>age</span></div>';
    // Built as elements, not interpolated markup: a command line is arbitrary
    // program input and this page has been frozen once already by a string that
    // arrived in an attribute.
    el.innerHTML = `<div class="crash-bar">
        <button class="crash-del" id="crash-del" disabled></button>
        <span class="crash-count">${crashRows.length} reports · ${fmtBytes(bytes)} · never auto-deleted</span>
      </div><div class="crash-grid">${head}</div>`;
    const grid = el.querySelector('.crash-grid');
    crashRows.forEach(r => {
      const row = document.createElement('div');
      row.className = 'crash-row' + (crashSel.has(r.name) ? ' sel' : '');
      const box = document.createElement('input');
      box.type = 'checkbox'; box.checked = crashSel.has(r.name);
      box.addEventListener('change', () => {
        box.checked ? crashSel.add(r.name) : crashSel.delete(r.name);
        crashArmed = false;
        renderCrashes();
      });
      row.appendChild(box);
      const cmd = document.createElement('span');
      cmd.className = 'crash-cmd';
      cmd.textContent = r.command || r.name;
      cmd.title = (r.command || r.name) + '  —  click to open';
      cmd.addEventListener('click', () => openPane(r.id, r.name));
      row.appendChild(cmd);
      [[r.pid, ''], [r.reason, ' crash-why'], [r.when, ''],
       [fmtBytes(r.size), ''], [crashAge(r.age_s), '']].forEach(([v, extra]) => {
        const c = document.createElement('span');
        c.className = 'crash-n' + extra;
        c.textContent = v == null ? '—' : v;
        row.appendChild(c);
      });
      grid.appendChild(row);
    });
    const del = el.querySelector('#crash-del');
    del.disabled = crashSel.size === 0;
    del.className = 'crash-del' + (crashArmed ? ' armed' : '');
    // Two clicks, not a modal: the first arms and says what will happen, the
    // second does it. Irreversible, so it never happens on one click.
    del.textContent = crashSel.size === 0 ? 'Delete selected'
      : crashArmed ? `Really delete ${crashSel.size}? This cannot be undone`
                   : `Delete ${crashSel.size} selected`;
    del.onclick = () => {
      if (!crashArmed) { crashArmed = true; renderCrashes(); return; }
      const names = [...crashSel];
      fetch('/oneshots/delete', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({names})
      }).then(r => r.json()).then(res => {
        (res.deleted || []).forEach(n => crashSel.delete(n));
        crashArmed = false;
        loadCrashes();
      }).catch(() => { crashArmed = false; renderCrashes(); });
    };
  }

  function loadCrashes() {
    fetch('/oneshots').then(r => r.json()).then(d => {
      crashRows = d.rows || [];
      renderCrashes();
    }).catch(() => {});
  }

  // Delegated, like every other handler on this list: the list is rebuilt on a
  // 10s poll, so a listener bound to the button itself dies with the first
  // refresh and the icon goes quietly inert.
  document.getElementById('console-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.sid-copy');
    if (!btn) return;
    e.stopPropagation();                 // never reaches the group underneath
    const el = btn.closest('.sid');
    const full = (el && el.dataset.sid) || '';
    if (!full) return;
    const settle = (state) => {
      el.dataset.state = state;
      clearTimeout(el._sidT);
      el._sidT = setTimeout(() => { delete el.dataset.state; }, 1600);
    };
    // The async Clipboard API needs a secure context AND permission the
    // embedding frame may not grant. execCommand is the path that still works
    // there, so a refusal falls back rather than failing — and if BOTH refuse,
    // the row says so instead of pretending.
    const viaSelection = () => {
      const ta = document.createElement('textarea');
      ta.value = full;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      settle(ok ? 'copied' : 'failed');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(() => settle('copied'), viaSelection);
    } else {
      viaSelection();
    }
  });

  document.getElementById('console-list').addEventListener('click', (e) => {
    if (!e.target.closest('#crash-toggle')) return;
    const el = document.getElementById('crash-panel');
    if (!el) return;
    el.hidden = !el.hidden;
    if (!el.hidden && !crashRows.length) loadCrashes();
  });

  function refreshProcStats() {
    const panel = document.getElementById('console-panel');
    if (!panel || !panel.classList.contains('active')) return;
    const rows = [...document.querySelectorAll('#console-list .dmn-row')];
    fetch('/procstats').then(r => r.json()).then(resp => {
      renderSys(resp.system);
      renderSpool(resp.spool);
      const m = resp.rows || {};
      rows.forEach(row => {
        const s = m[row.dataset.id];
        if (!s) return;
        const p = s.live ? s : null;
        const put = (f, v) => {
          const el = row.querySelector(`[data-f="${f}"]`);
          if (el && el.textContent !== v) el.textContent = v;
        };
        put('pid', cellPid(p)); put('nice', cellNice(p)); put('load', cellLoad(p));
        put('cputime', cellCpu(p)); put('rss', cellRss(p));
        // Each channel carries its own size and its own liveness — a daemon
        // writing its product log while its captured stream sits finished is
        // the normal case, not an edge one.
        ['out', 'log'].forEach(which => {
          const el = row.querySelector(`[data-ch="${which}"]`);
          const ch = (s.ch || {})[which];
          if (!el || !ch) return;
          const v = fmtBytes(ch.size);
          if (el.textContent !== v) el.textContent = v;
          el.classList.toggle('live', !!ch.live);
        });
        const dot = row.querySelector('.dot');
        if (dot) dot.hidden = !s.live;
      });
    }).catch(() => {});
  }
  setInterval(refreshProcStats, TOP_INTERVAL_MS);

  // ONE clock for the whole page: local, 24-hour, zero-padded. `toLocaleTime‐
  // String()` follows the browser's locale, which on this machine renders
  // 12-hour with am/pm — so the transcript disagreed with the server's own
  // stamps, the log lines and every other time on the page. A reader comparing
  // a transcript turn against a log line should not have to convert.
  function fmtClock(v) {
    const d = (v instanceof Date) ? v : new Date(v);
    if (isNaN(d)) return '';
    const p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function fmtSecs(s) {
    if (s < 60) return Math.round(s) + 's';
    if (s < 3600) return Math.round(s / 60) + 'm';
    return (s / 3600).toFixed(s < 36000 ? 1 : 0) + 'h';
  }

  // One timer for every pane rather than one per pane: the tick stays aligned
  // and closing a pane cannot leave an orphan interval running. Panes pace
  // themselves against this master tick by counting it down, so adaptive
  // polling costs no extra timers.
  const POLL_TICK_MS = 250;
  const POLL_IDLE_TICKS = 4;          // quiet pane → one poll per second
  // Retained scrollback per pane, in bytes. Bounded in bytes rather than lines
  // because a single line can be megabytes and a line cap bounds nothing.
  const PANE_BUFFER_BYTES = 5 * 1024 * 1024;
  // The tighter cap for a pane nobody is reading BACK through. A live tail is
  // watched at its end, so deep scrollback there costs memory for content no
  // eye is on; 2MB is still ~20k lines of it. The moment the reader holds
  // position or searches they ARE reading the history, and the full 5MB
  // applies — so scrollback is never yanked out from under someone using it.
  // That is the whole reason the tighter cap is conditional rather than
  // absolute: trimming is irreversible, and a buffer that shrank because a
  // stream blipped live would destroy what the reader had scrolled back to.
  const PANE_BUFFER_LIVE_BYTES = 2 * 1024 * 1024;
  const PANE_LIVE_MS = 1500;   // same threshold the pill calls "streaming"

  function paneCap(p) {
    const tailing = (Date.now() - p.lastData) < PANE_LIVE_MS
                    && !p.hold && !p.search;
    return tailing ? PANE_BUFFER_LIVE_BYTES : PANE_BUFFER_BYTES;
  }

  // One trimmer for both append sites. The loop was inline twice, and the
  // vertical-scroll compensation below was in neither: removing nodes from the
  // TOP shrinks scrollHeight while scrollTop keeps its number, so the content
  // slides up under a reader who is holding position — the horizontal axis was
  // protected against exactly this and the vertical one was not.
  function trimBuffer(p) {
    const cap = paneCap(p);
    if ((p.bytes || 0) <= cap) return;
    const h0 = p.body.scrollHeight;
    while (p.bytes > cap) {
      let victim = p.body.firstChild;
      if (victim === p.edgeEl) victim = victim.nextSibling;
      if (!victim) break;
      p.bytes -= (victim.textContent || '').length;
      p.body.removeChild(victim);
    }
    // The window states its own edge. Capture never drops a byte — the file
    // keeps everything — but the PANE is a window onto it, and a reader who
    // scrolls to the top and finds their output gone reads that as data loss.
    // Same doctrine as the capture-gap notice: an unstated boundary reads as
    // "nothing happened".
    if (!p.edgeEl) {
      p.edgeEl = document.createElement('div');
      p.edgeEl.className = 'buf-edge';
      p.edgeEl.textContent =
        'earlier output is in the file, not in this pane';
    }
    if (p.body.firstChild !== p.edgeEl)
      p.body.insertBefore(p.edgeEl, p.body.firstChild);
    if (p.hold || p.search) p.body.scrollTop -= (h0 - p.body.scrollHeight);
  }
  setInterval(() => {
    panes.forEach(p => {
      if (p.due > 0) { p.due -= 1; return; }
      p.due = p.gap;
      pollPane(p);
    });
  }, POLL_TICK_MS);

  // One delegated handler rather than a listener per chip — the list is
  // re-rendered on every poll, and per-node listeners would be rebound each time.
  document.getElementById('console-list').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip, .dmn-open');
    if (!chip) return;
    openPane(chip.dataset.id, chip.dataset.label || chip.textContent.trim());
  });

  document.getElementById('console-refresh')
    .addEventListener('click', () => loadConsoles(true));

  loadConsoles();
  setInterval(loadConsoles, 10000);

  // Escapes for BOTH contexts this is used in — element text and quoted
  // attributes. The textContent round-trip alone handles & < > and leaves " and
  // ' untouched, which is invisible for as long as every value is a fixed
  // string or a constrained name, and fatal the moment one carries arbitrary
  // output: a chip label built from a log's first line closed its `data-label="`
  // early and the rest of it parsed as markup, corrupting the DOM after the
  // first chip. Callers must not have to know which context they are in, so the
  // one escaper covers the union.
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
})();
</script>
